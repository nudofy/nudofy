project_id = "bpdtjjhexygryvxrhivl"

[auth]
# nudofy.app fue el dominio original del proyecto — ya no está conectado a
# ningún proyecto de Vercel (verificado 2026-07-15). site_url es solo el
# fallback cuando una llamada de auth no pasa redirectTo explícito; todo el
# código actual sí lo pasa, pero mejor no dejar el fallback apuntando a un
# dominio muerto.
site_url = "https://app.nudofy.com"
additional_redirect_urls = ["nudofy://**", "https://app.nudofy.com/**"]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.recovery]
subject = "Restablece tu contraseña - Nudofy"
content_path = "./supabase/templates/recovery.html"

# Sin esto, `supabase config push` intenta activar vector buckets (default
# de la CLI) y falla con 402 porque el proyecto está en plan gratuito —
# inofensivo pero rompía la salida de cada push. Este proyecto no usa
# embeddings/vector search.
[storage.vector]
enabled = false
